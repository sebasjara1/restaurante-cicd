# Entrega continua: se ejecuta solo cuando el CI pasa en main.
# Publica la imagen, la prueba en staging y espera aprobación para producción.
name: CD

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

# Nunca se cancelan despliegues a medias; si llegan varios, esperan su turno.
concurrency:
  group: cd-main
  cancel-in-progress: false

permissions:
  contents: read

env:
  IMAGEN: ghcr.io/${{ github.repository }}
  REF: ${{ github.event.workflow_run.head_sha || github.sha }}

jobs:
  publicar:
    name: Publicar imagen en GHCR
    # Solo despliega si el CI vino de un push a main de este mismo repositorio,
    # nunca de un pull request ni de un fork (corrección de alerta de CodeQL).
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      version: ${{ steps.datos.outputs.version }}
      etiqueta: ${{ steps.datos.outputs.etiqueta }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.REF }}
      - name: Leer versión y commit
        id: datos
        run: |
          echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"
          echo "etiqueta=sha-$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v4
      - name: Construir y publicar la imagen
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          build-args: APP_VERSION=${{ steps.datos.outputs.version }}
          tags: |
            ${{ env.IMAGEN }}:${{ steps.datos.outputs.etiqueta }}
            ${{ env.IMAGEN }}:${{ steps.datos.outputs.version }}
            ${{ env.IMAGEN }}:latest
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ steps.datos.outputs.version }}
          # Sin caché en el CD para evitar envenenamiento de caché.
          no-cache: true

  staging:
    name: Desplegar en staging
    needs: publicar
    runs-on: ubuntu-latest
    environment: staging
    permissions:
      contents: read
      packages: read
    env:
      # Token de demostración para el entorno de pruebas, no es un secreto real.
      API_TOKEN: token-staging
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.REF }}
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          package-manager-cache: false
      - run: npm ci
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Levantar la imagen publicada
        run: |
          docker run -d --name restaurante-staging -p 3000:3000 \
            -e API_TOKEN="$API_TOKEN" \
            "$IMAGEN:${{ needs.publicar.outputs.etiqueta }}"
      - name: Prueba de humo
        run: bash scripts/smoke-test.sh http://localhost:3000 ${{ needs.publicar.outputs.version }}
      - name: Prueba de carga
        run: npm run carga -- http://localhost:3000
      - name: Estado del contenedor
        if: always()
        run: |
          docker ps --filter name=restaurante-staging --format "table {{.Names}}\t{{.Image}}\t{{.Status}}"
          docker logs restaurante-staging

  produccion:
    name: Desplegar en producción
    needs: [publicar, staging]
    runs-on: ubuntu-latest
    # El entorno production exige aprobación manual antes de ejecutar este job.
    environment: production
    permissions:
      contents: read
      packages: write
    env:
      RENDER_DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
    steps:
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v4
      - name: Promover la imagen probada a producción
        run: |
          docker buildx imagetools create \
            -t "$IMAGEN:produccion" \
            "$IMAGEN:${{ needs.publicar.outputs.etiqueta }}"
      - name: Desplegar en Render (opcional)
        if: env.RENDER_DEPLOY_HOOK != ''
        run: curl -fsS -X POST "$RENDER_DEPLOY_HOOK" > /dev/null
      - name: Resumen
        run: |
          {
            echo "## Despliegue en producción"
            echo ""
            echo "- Versión: ${{ needs.publicar.outputs.version }}"
            echo "- Imagen: \`$IMAGEN:${{ needs.publicar.outputs.etiqueta }}\`"
            echo "- Etiqueta de producción: \`$IMAGEN:produccion\`"
            echo "- Commit: \`${{ env.REF }}\`"
          } >> "$GITHUB_STEP_SUMMARY"
