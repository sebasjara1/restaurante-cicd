# Integración continua: revisa cada pull request antes de unirlo a main.
name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

# Si llega un cambio nuevo al mismo PR, se cancela la ejecución anterior.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: Lint (ESLint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint

  pruebas:
    name: Pruebas y cobertura
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Ejecutar pruebas unitarias y de integración
        # shell: bash activa pipefail, así el tee no oculta una prueba fallida
        shell: bash
        run: npm run test:ci 2>&1 | tee resultado-pruebas.txt
      - name: Publicar resumen de pruebas
        if: always()
        run: |
          echo "## Resultado de las pruebas" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          grep -E "^ℹ (tests|pass|fail)|all files|\.js +\|" resultado-pruebas.txt >> "$GITHUB_STEP_SUMMARY" || true
          echo '```' >> "$GITHUB_STEP_SUMMARY"
      - name: Guardar reporte JUnit
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: reporte-pruebas
          path: |
            reports/junit.xml
            resultado-pruebas.txt

  seguridad:
    name: Seguridad (npm audit)
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Buscar dependencias con vulnerabilidades altas o críticas
        run: npm audit --audit-level=high

  build:
    name: Build imagen Docker
    runs-on: ubuntu-latest
    needs: [pruebas, seguridad]
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Construir la imagen
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          load: true
          tags: restaurante-api:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Verificar que el contenedor arranca y responde
        run: |
          docker run -d --name api -p 3000:3000 restaurante-api:ci
          for i in $(seq 1 15); do
            curl -sf http://localhost:3000/health && exit 0
            sleep 1
          done
          echo "La API no respondió en /health"
          docker logs api
          exit 1
